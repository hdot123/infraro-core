name: Release Please

# 批处理发版策略：
# - schedule: 每天定时 2 次（北京时间 12:00 / 20:00），批量打包积攒的 commits
# - push(paths): release PR 合并时自动触发（仅 .release-please-manifest.json 变更）
# - workflow_dispatch: 手动即时发版
# 代码 PR 实时合入 main 不变，发版与合入解耦。
on:
  schedule:
    - cron: '0 4 * * *'   # 北京时间 12:00
    - cron: '0 12 * * *'   # 北京时间 20:00
  push:
    branches:
      - main
    paths:
      - '.release-please-manifest.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # 2026-09-19 governance（VAL-CORE-009）：发版链路走 production environment
    # 审批门（required reviewer hdot123，VAL-CROSS-004）。release PR 的创建与
    # tag 发布自此需人工批准后执行（部署分支策略：branch main + tag v*）。
    environment: production
    steps:
      # Checkout main for setup-venv and action references
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup venv (per-run isolation)
        uses: ./.github/actions/setup-venv

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.DISPATCH_TOKEN }}

      # ─── Release PR uv.lock relock（INFRA-712 根治）───
      # release-please 只 bump pyproject.toml 不 relock（PR #136 实证仅改
      # manifest/CHANGELOG/pyproject/__init__），uv.lock 根包版本原地踏步，
      # 造成 0.7.2 漂移（PR #163 补救、INFRA-678 同类）。本步骤在
      # release-please-action 运行后检测其维护的 Release PR 分支，relock
      # 并回推，使 Release PR 自带对齐的 uv.lock。
      # 时序：action 每轮 schedule 维护同一 Release PR（autorelease: pending），
      # 本步随后 relock push；下一轮 sweep 时 Release PR 已含 uv.lock，
      # action 不会回退该文件（只重写自己管理的清单文件）。
      # setup-venv install uv per runner-tools.toml 钉版（0.12.7），本步使
      # github-hosted runner 亦能可靠执行 relock。
      # 分支探测：v4 action 无 release_branch output（INFRA-712 原实现
      # 引用了不存在的输出，两輪 schedule 实测永久空跳过，PR #171 漂移
      # 实证）。改用 gh 按 autorelease: pending 标签查询 Release PR 分支，
      # 不依赖 action 输出。本 job 已有 checkout，relock 在共享工作区进行。
      # 改进：2026-09-18 为解决 PR #64 红腿问题，增加基于分支名的双重探测
      # 机制（release-please 默认分支名：release-please--branches--<base_branch>）。
      - name: Relock uv.lock on Release PR (INFRA-712)
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          # 双重探测机制：先按 autorelease: pending 标签定位 Release PR 分支
          BRANCH=""
          
          # 第一重：按标签探测（原有逻辑，保持兼容）
          for attempt in 1 2 3 4 5; do
            BRANCH="$(gh pr list -R "${GITHUB_REPOSITORY}" --state open \
              --label "autorelease: pending" --limit 1 \
              --json headRefName --jq '.[0].headRefName // empty' 2>/dev/null || true)"
            if [ -n "$BRANCH" ]; then
              echo "Found Release PR via label: $BRANCH"
              break
            fi
            echo "Release PR not visible by label yet (attempt ${attempt}/5)"
            if [ "$attempt" -lt 5 ]; then
              sleep 15
            fi
          done
          
          # 第二重：按默认分支名探测（新增逻辑，提高可靠性）
          if [ -z "$BRANCH" ]; then
            DEFAULT_BRANCH_NAME="release-please--branches--main"
            echo "Trying default branch name: $DEFAULT_BRANCH_NAME"
            
            # 检查该分支是否存在且是一个开放的 PR
            if git ls-remote --heads origin "$DEFAULT_BRANCH_NAME" | grep -q "$DEFAULT_BRANCH_NAME"; then
              # 确认这个分支确实对应一个 PR
              PR_FOR_DEFAULT=$(gh pr list -R "${GITHUB_REPOSITORY}" --state open --head "$DEFAULT_BRANCH_NAME" --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)
              if [ -n "$PR_FOR_DEFAULT" ]; then
                BRANCH="$DEFAULT_BRANCH_NAME"
                echo "Found Release PR via default branch name: $BRANCH"
              else
                echo "Default branch exists but no PR found for it"
              fi
            else
              echo "Default branch $DEFAULT_BRANCH_NAME does not exist"
            fi
          fi
          
          if [ -z "$BRANCH" ]; then
            echo "No open Release PR found after dual detection attempts; nothing to relock"
            exit 0
          fi
          echo "Release PR branch: $BRANCH"

          # Fetch the release branch to make it available locally
          git fetch origin "$BRANCH":"$BRANCH"
          
          # Checkout the release branch to make sure uv lock runs on the correct branch
          git checkout "$BRANCH"
          
          # relock：更新 uv.lock 根包版本至 pyproject 当前版本（幂等——
          # 已对齐時 uv lock 不產生 diff）
          # Using env -u to remove UV_CACHE_DIR to prevent empty string pollution
          echo "Running uv lock with UV_CACHE_DIR removed to avoid parameter error"
          env -u UV_CACHE_DIR uv lock

          if git diff --quiet uv.lock; then
            echo "uv.lock already aligned; no push needed"
            exit 0
          fi

          # Configure git for the commit
          git config user.name "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"

          git add uv.lock
          git commit -m "chore(release): relock uv.lock root package version (INFRA-712)"
          git push origin "$BRANCH"
          echo "Pushed relock commit to $BRANCH"
