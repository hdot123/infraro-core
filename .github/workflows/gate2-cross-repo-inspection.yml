name: Gate 2 - Cross-repository Inspection Cron

# substrate 五道门·门2（substrate-gate-suite）：跨仓 cron 巡检。
# 巡检面 = GitHub 可见面（gh api + GITHUB_TOKEN）：冻结仓 open PR / 残留分支、
# 声明仓 substrate workflow 在场性；本地 registry 面（repositories.yml /
# ERROR_REPO_MAP）runner 上无 ~/.factory，自动降级 LOCAL-ONE。
# advisory 语义：本 workflow 独立于 ci.yml，红不阻断任何 PR 合并；存量登记于
# substrate/gate0-exemptions.md（owner + 归属 feature）。

on:
  schedule:
    # Run every hour at minute 15 (avoiding :00/:30 peaks as per requirement)
    - cron: '15 * * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

# 2026-09-19 governance（VAL-CORE-003）：schedule 型串行（cancel-in-progress
# false）。巡检幂等（冻结仓 open PR / 残留分支快照），两次重叠 run 无信息
# 增量，排队即可；取消进行中腿反而可能截断 gh api 分页留下半份巡检面。
concurrency:
  group: gate2-cross-repo-inspection
  cancel-in-progress: false

jobs:
  cross-repo-inspection:
    name: Cross-repository Inspection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Gate 2 - Cross-repository Inspection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python substrate/gates/gate2_cross_repo.py
